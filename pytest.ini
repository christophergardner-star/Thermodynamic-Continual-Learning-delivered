[pytest]
# Scope collection to the real unit-test suite. The two repo-root scripts
# (test_tar_comprehensive.py, test_tar_integration.py) are standalone tools
# that run at import and call sys.exit() — collecting them INTERNALERRORs the
# whole run to "0 collected". Run those directly: `python test_tar_comprehensive.py`.
testpaths = tests
addopts = -m "not slow"
markers =
    slow: long-running benchmark tests excluded from the default suite
